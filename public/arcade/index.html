<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080f" />
  <title>Luckyverse Arcade · 40 Games</title>
  <link rel="icon" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <header class="top">
    <a class="brand" href="../">Luckyverse</a>
    <p>Arcade</p>
  </header>
  <main>
    <section class="hero">
      <p class="kicker">Forty originals</p>
      <h1>A pocket arcade with a different game every door.</h1>
      <p class="lede">Runners, gardens, curling sheets, mirror chambers, and rhythm lanes. Built for touch, scored on this device, and drawn to stay smooth on a phone.</p>
    </section>
    <div class="tools">
      <label class="search">
        <span class="sr">Search games</span>
        <input id="q" type="search" placeholder="Search games" autocomplete="off" />
      </label>
      <div id="filters" class="filters" role="tablist"></div>
    </div>
    <p id="count" class="count"></p>
    <section id="grid" class="grid"></section>
  </main>
  <script src="./catalog.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');
    const q = document.getElementById('q');
    const count = document.getElementById('count');
    const genres = ['All', ...new Set(ARCADE_GAMES.map((g) => g.genre))];
    let genre = 'All';

    function hash(id) {
      let h = 2166136261;
      for (const c of id) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
      return () => {
        h = Math.imul(h ^ (h >>> 15), 2246822519);
        h = Math.imul(h ^ (h >>> 13), 3266489917);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    function icon(id, a, b) {
      const rnd = hash(id);
      let body = '';
      const n = 3 + ((rnd() * 3) | 0);
      for (let i = 0; i < n; i += 1) {
        const fill = i % 2 ? b : a;
        const t = rnd();
        if (t < 0.34) {
          body += `<circle cx="${(18 + rnd() * 84).toFixed(1)}" cy="${(18 + rnd() * 84).toFixed(1)}" r="${(10 + rnd() * 22).toFixed(1)}" fill="${fill}" fill-opacity="${0.55 + rnd() * 0.45}"/>`;
        } else if (t < 0.67) {
          body += `<rect x="${(rnd() * 58).toFixed(1)}" y="${(rnd() * 58).toFixed(1)}" width="${(22 + rnd() * 36).toFixed(1)}" height="${(22 + rnd() * 36).toFixed(1)}" rx="10" fill="${fill}" transform="rotate(${(rnd() * 50 - 25).toFixed(1)} 60 60)"/>`;
        } else {
          const pts = [0, 1, 2].map(() => `${(rnd() * 110).toFixed(1)},${(rnd() * 110).toFixed(1)}`).join(' ');
          body += `<polygon points="${pts}" fill="${fill}" fill-opacity="0.85"/>`;
        }
      }
      return `<svg viewBox="0 0 120 120" aria-hidden="true">${body}</svg>`;
    }

    genres.forEach((name) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = name;
      btn.className = name === genre ? 'on' : '';
      btn.addEventListener('click', () => {
        genre = name;
        [...filters.children].forEach((el) => el.classList.toggle('on', el.textContent === name));
        render();
      });
      filters.appendChild(btn);
    });

    function render() {
      const query = q.value.trim().toLowerCase();
      const list = ARCADE_GAMES.filter((g) => (genre === 'All' || g.genre === genre) && (!query || `${g.title} ${g.blurb} ${g.genre}`.toLowerCase().includes(query)));
      count.textContent = `${list.length} game${list.length === 1 ? '' : 's'}`;
      grid.innerHTML = list.map((g, i) => `
        <a class="card" href="./games/${g.id}.html" style="--accent:${g.palette.accent};--accent2:${g.palette.accent2};--bg1:${g.palette.bg1}">
          <div class="mark">${icon(g.id, g.palette.accent, g.palette.accent2)}</div>
          <div>
            <p class="meta"><span>${String(ARCADE_GAMES.indexOf(g) + 1).padStart(2, '0')}</span> ${g.genre}</p>
            <h2>${g.title}</h2>
            <p>${g.blurb}</p>
          </div>
        </a>`).join('');
    }

    q.addEventListener('input', render);
    render();
  </script>
</body>
</html>
